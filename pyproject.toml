[project]
name = "devloot-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "p2arthur", email = "arthurrabelopro@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.32",
    "langchain>=1.4.8",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "openai>=3.42.1",
    "psycopg[binary]>=3.3.7",
    "python-dotenv>=1.2.4",
]

[project.scripts]
devloot-harness = "devloot_harness:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
